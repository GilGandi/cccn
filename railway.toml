[build]
builder = "nixpacks"
buildCommand = "npm install --legacy-peer-deps && ./node_modules/.bin/prisma generate && ./node_modules/.bin/next build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["nodejs_20"]

[build.nixpacksPlan.variables]
NEXT_TELEMETRY_DISABLED = "1"

[deploy]
startCommand = "bash scripts/migrate-safe.sh && node .next/standalone/server.js"
restartPolicyType = "on_failure"
