[build]
builder = "nixpacks"
buildCommand = "npm install --legacy-peer-deps && ./node_modules/.bin/prisma generate && ./node_modules/.bin/next build"

[build.nixpacksPlan.phases.setup]
nixPkgs = ["nodejs_20"]

[build.nixpacksPlan.variables]
NEXT_TELEMETRY_DISABLED = "1"

[deploy]
startCommand = "bash scripts/migrate-safe.sh && ./node_modules/.bin/next start -p $PORT"
restartPolicyType = "on_failure"
